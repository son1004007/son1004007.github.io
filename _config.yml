# Site setup
title: SON Kiseok Technical Blog
description: 개발과 운영, AI 협업, 학습뿐 아니라 주택·생활·장기 의사결정까지 다시 확인할 가치가 있는 경험과 기록을 정리합니다.
url: https://son1004007.github.io
baseurl: ""
paginate: 5
permalink: pretty
lang: ko-KR
future: true

# Google Search Console
google_site_verification: u8hiK-I85rDdzv5nny-fDPiuq2pAyKzC9eL4ak28qOM

# Google Analytics 4
# Optional. Paste a GA4 measurement/tag ID such as G-XXXXXXXXXX to enable it.
google_analytics:

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - AGENTS.md
  - docs

sass:
  sass_dir: _sass
  style: :compressed

# Author
author:
  name: SON Kiseok

# Custom vars
version: 3.0.1

# Navbar page list
nav:
  - title: Blog
    url: /archive

  - title: Topics
    url: /categories

  - title: Notes
    url: /notes

  - title: Study
    url: /study

  - title: About
    url: /about
