  <text x="380" y="251" font-size="17" text-anchor="middle" fill="#334155">검증이 부족하면 입력 주소로 요청</text>
<rect x="44" y="305" width="672" height="81" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="337" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">내부·제한된 서비스</text>
  <text x="380" y="363" font-size="17" text-anchor="middle" fill="#334155">서버 권한·네트워크 위치가 악용될 위험</text>
