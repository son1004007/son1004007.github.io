<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540" role="img" aria-labelledby="title desc">
<title id="title">SSRF · 서버가 지정된 주소로 요청</title>
<desc id="desc">공격자가 제출한 URL: 공격자가 URL 입력 기능을 이용 → 백엔드 서버: 서버가 입력받은 URL로 요청 → 네트워크 대상: 공격자가 서버 접근 범위를 악용. 서버: 목적지 허용목록 · DNS/IP 검증. 인프라: 리다이렉트 · 송신 경로 통제</desc>
<rect width="480" height="540" rx="16" fill="#ffffff"/>
<g font-family="Noto Sans CJK KR, NanumGothic, sans-serif">
<text x="240" y="43" font-size="21" font-weight="700" text-anchor="middle" fill="#7c3aed">SSRF · 서버가 지정된 주소로 요청</text>
<rect x="19" y="81" width="442" height="96" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="240" y="119" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">공격자가 제출한 URL</text>
<text x="240" y="149" font-size="16" text-anchor="middle" fill="#334155">공격자가 URL 입력 기능을 이용</text>
<rect x="19" y="208" width="442" height="96" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="240" y="246" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">백엔드 서버</text>
<text x="240" y="276" font-size="16" text-anchor="middle" fill="#334155">서버가 입력받은 URL로 요청</text>
<rect x="19" y="335" width="442" height="96" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="240" y="373" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">네트워크 대상</text>
<text x="240" y="403" font-size="16" text-anchor="middle" fill="#334155">공격자가 서버 접근 범위를 악용</text>
<path d="M240 178 V207" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M232 199 L240 208 L248 199" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="261" y="196" font-size="14" fill="#475569">공격자가 URL 전달</text>
<path d="M240 305 V334" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M232 326 L240 335 L248 326" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="261" y="323" font-size="14" fill="#475569">서버가 네트워크 요청</text>
<rect x="12" y="471" width="456" height="60" rx="10" fill="#f1f5f9"/>
<text x="240" y="495" font-size="15" font-weight="600" text-anchor="middle" fill="#334155">서버: 목적지 허용목록 · DNS/IP 검증</text>
<text x="240" y="519" font-size="15" font-weight="600" text-anchor="middle" fill="#334155">인프라: 리다이렉트 · 송신 경로 통제</text>
</g>
</svg>
