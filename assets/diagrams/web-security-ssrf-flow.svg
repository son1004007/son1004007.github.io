<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="464" viewBox="0 0 760 464" role="img" aria-labelledby="title desc">
<title id="title">SSRF - 서버의 네트워크 요청 기능 악용</title>
<desc id="desc">공격자가 입력한 주소: URL 다운로드·Webhook 설정 등에 전달 → 백엔드 서버: 검증이 부족하면 입력 주소로 요청 → 내부·제한된 서비스: 서버 권한·네트워크 위치가 악용될 위험. 핵심 방어: 목적지 허용목록 + IP·DNS·리다이렉트 검증</desc>
<rect width="760" height="464" fill="#ffffff" rx="16"/>
<text x="380" y="43" font-family="Arial, Noto Sans KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#7c3aed">SSRF - 서버의 네트워크 요청 기능 악용</text>
<g font-family="Arial, Noto Sans KR, sans-serif">
<rect x="44" y="81" width="672" height="81" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="113" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">공격자가 입력한 주소</text>
  <text x="380" y="139" font-size="17" text-anchor="middle" fill="#334155">URL 다운로드·Webhook 설정 등에 전달</text>
