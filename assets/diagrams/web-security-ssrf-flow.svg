<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540" role="img" aria-labelledby="title desc">
<title id="title">SSRF · 서버를 통한 원치 않는 요청</title>
<desc id="desc">공격자가 입력한 URL: 다운로드·Webhook 설정에 입력 → 백엔드 서버: 검증이 부족하면 해당 URL로 요청 → 내부·제한된 서비스: 서버의 접근 권한이 악용될 위험. 방어: 목적지 허용목록 · IP/DNS 검증. 리다이렉트·송신 트래픽 통제</desc>
<rect x="0" y="0" width="480" height="540" rx="16" fill="#ffffff"/>
<g font-family="Arial, Noto Sans KR, sans-serif">
<text x="240" y="43" font-size="22" font-weight="700" text-anchor="middle" fill="#7c3aed">SSRF · 서버를 통한 원치 않는 요청</text>
<rect x="21" y="83" width="438" height="94" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="240" y="120" font-size="23" font-weight="700" text-anchor="middle" fill="#0f172a">공격자가 입력한 URL</text>
<text x="240" y="150" font-size="16" text-anchor="middle" fill="#334155">다운로드·Webhook 설정에 입력</text>
<rect x="21" y="210" width="438" height="94" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="240" y="247" font-size="23" font-weight="700" text-anchor="middle" fill="#0f172a">백엔드 서버</text>
<text x="240" y="277" font-size="16" text-anchor="middle" fill="#334155">검증이 부족하면 해당 URL로 요청</text>
<rect x="21" y="337" width="438" height="94" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="240" y="374" font-size="23" font-weight="700" text-anchor="middle" fill="#0f172a">내부·제한된 서비스</text>
<text x="240" y="404" font-size="16" text-anchor="middle" fill="#334155">서버의 접근 권한이 악용될 위험</text>
<path d="M240 178 V207" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M232 199 L240 208 L248 199" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="261" y="197" font-size="14" fill="#475569">URL 전달</text>
<path d="M240 305 V334" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M232 326 L240 335 L248 326" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="261" y="324" font-size="14" fill="#475569">서버가 접근</text>
<rect x="13" y="472" width="454" height="58" rx="10" fill="#f1f5f9"/>
<text x="240" y="495" font-size="16" font-weight="600" text-anchor="middle" fill="#334155">방어: 목적지 허용목록 · IP/DNS 검증</text>
<text x="240" y="518" font-size="16" font-weight="600" text-anchor="middle" fill="#334155">리다이렉트·송신 트래픽 통제</text>
</g>
</svg>
