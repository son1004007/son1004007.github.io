<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540" role="img" aria-labelledby="title desc">
<title id="title">CSRF · 브라우저가 위조 요청 전송</title>
<desc id="desc">공격자 사이트: 공격자가 조작된 요청을 유도 → 사용자 브라우저: 브라우저가 정책에 따라 쿠키 전송 → 정상 서비스: 서버가 CSRF 토큰을 검증. 서버: CSRF 토큰 · Origin 검사. 브라우저: SameSite 쿠키 정책</desc>
<rect width="480" height="540" rx="16" fill="#ffffff"/>
<g font-family="Noto Sans CJK KR, NanumGothic, sans-serif">
<text x="240" y="43" font-size="21" font-weight="700" text-anchor="middle" fill="#1d4ed8">CSRF · 브라우저가 위조 요청 전송</text>
<rect x="19" y="81" width="442" height="96" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="240" y="119" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">공격자 사이트</text>
<text x="240" y="149" font-size="16" text-anchor="middle" fill="#334155">공격자가 조작된 요청을 유도</text>
