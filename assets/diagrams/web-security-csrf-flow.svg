<text x="240" y="246" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">사용자 브라우저</text>
<text x="240" y="276" font-size="16" text-anchor="middle" fill="#334155">브라우저가 정책에 따라 쿠키 전송</text>
<rect x="19" y="335" width="442" height="96" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="240" y="373" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">정상 서비스</text>
<text x="240" y="403" font-size="16" text-anchor="middle" fill="#334155">서버가 CSRF 토큰을 검증</text>
<path d="M240 178 V207" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M232 199 L240 208 L248 199" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="261" y="196" font-size="14" fill="#475569">공격자가 사용자 유도</text>
<path d="M240 305 V334" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M232 326 L240 335 L248 326" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="261" y="323" font-size="14" fill="#475569">브라우저가 요청 전송</text>
<rect x="12" y="471" width="456" height="60" rx="10" fill="#f1f5f9"/>
<text x="240" y="495" font-size="15" font-weight="600" text-anchor="middle" fill="#334155">서버: CSRF 토큰 · Origin 검사</text>
<text x="240" y="519" font-size="15" font-weight="600" text-anchor="middle" fill="#334155">브라우저: SameSite 쿠키 정책</text>
</g>
