<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="464" viewBox="0 0 760 464" role="img" aria-labelledby="title desc">
<title id="title">CSRF - 로그인 상태를 악용한 요청 위조</title>
<desc id="desc">공격자 사이트: 사용자에게 조작된 요청을 유도 → 사용자 브라우저: 조건에 따라 로그인 쿠키가 함께 전송 → 정상 서비스: 요청의 CSRF 방어 검증이 중요. 핵심 방어: CSRF 토큰 + Origin 검사 + SameSite 보조</desc>
<rect width="760" height="464" fill="#ffffff" rx="16"/>
<text x="380" y="43" font-family="Arial, Noto Sans KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#2563eb">CSRF - 로그인 상태를 악용한 요청 위조</text>
<g font-family="Arial, Noto Sans KR, sans-serif">
<rect x="44" y="81" width="672" height="81" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="113" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">공격자 사이트</text>
  <text x="380" y="139" font-size="17" text-anchor="middle" fill="#334155">사용자에게 조작된 요청을 유도</text>
<rect x="44" y="193" width="672" height="81" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="225" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">사용자 브라우저</text>
  <text x="380" y="251" font-size="17" text-anchor="middle" fill="#334155">조건에 따라 로그인 쿠키가 함께 전송</text>
<rect x="44" y="305" width="672" height="81" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="337" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">정상 서비스</text>
  <text x="380" y="363" font-size="17" text-anchor="middle" fill="#334155">요청의 CSRF 방어 검증이 중요</text>
<path d="M380 164 V188" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M372 181 L380 190 L388 181" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="401" y="182" font-size="15" fill="#475569">요청 유도</text>
<path d="M380 276 V300" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M372 293 L380 302 L388 293" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="401" y="294" font-size="15" fill="#475569">인증된 요청 전송</text>
<rect x="28" y="420" width="704" height="32" rx="9" fill="#f1f5f9"/>
<text x="380" y="442" font-size="16" font-weight="600" text-anchor="middle" fill="#334155">핵심 방어: CSRF 토큰 + Origin 검사 + SameSite 보조</text>
</g>
</svg>
