<path d="M232 326 L240 335 L248 326" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="261" y="324" font-size="14" fill="#475569">쿠키 포함 요청</text>
<rect x="13" y="472" width="454" height="58" rx="10" fill="#f1f5f9"/>
<text x="240" y="495" font-size="16" font-weight="600" text-anchor="middle" fill="#334155">방어: CSRF 토큰 · Origin 검사</text>
<text x="240" y="518" font-size="16" font-weight="600" text-anchor="middle" fill="#334155">SameSite는 보조 방어</text>
