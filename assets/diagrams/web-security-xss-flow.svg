<text x="240" y="246" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">웹페이지 출력 처리</text>
<text x="240" y="276" font-size="16" text-anchor="middle" fill="#334155">웹페이지가 입력값을 코드로 삽입</text>
<rect x="19" y="335" width="442" height="96" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="240" y="373" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">방문자 브라우저</text>
