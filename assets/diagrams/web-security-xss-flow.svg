<text x="261" y="323" font-size="14" fill="#475569">브라우저가 코드 실행</text>
<rect x="12" y="471" width="456" height="60" rx="10" fill="#f1f5f9"/>
<text x="240" y="495" font-size="15" font-weight="600" text-anchor="middle" fill="#334155">애플리케이션: 출력 맥락별 인코딩</text>
<text x="240" y="519" font-size="15" font-weight="600" text-anchor="middle" fill="#334155">프런트엔드: 안전한 DOM API</text>
