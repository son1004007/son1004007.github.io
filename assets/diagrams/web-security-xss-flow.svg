<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540" role="img" aria-labelledby="title desc">
<title id="title">XSS · 브라우저가 악성 코드 실행</title>
<desc id="desc">공격자의 외부 입력: 공격자가 게시글 등에 문자열 전달 → 웹페이지 출력 처리: 웹페이지가 입력값을 코드로 삽입 → 방문자 브라우저: 브라우저가 악성 스크립트를 실행. 애플리케이션: 출력 맥락별 인코딩. 프런트엔드: 안전한 DOM API</desc>
<rect width="480" height="540" rx="16" fill="#ffffff"/>
<g font-family="Noto Sans CJK KR, NanumGothic, sans-serif">
<text x="240" y="43" font-size="21" font-weight="700" text-anchor="middle" fill="#b45309">XSS · 브라우저가 악성 코드 실행</text>
<rect x="19" y="81" width="442" height="96" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
