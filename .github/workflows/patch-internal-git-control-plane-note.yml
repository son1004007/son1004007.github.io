name: Patch internal Git control plane note

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-internal-git-control-plane-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add private-network constraint note
        shell: python
        run: |
          from pathlib import Path

          path = Path('_posts/2026-08-20-github-control-plane-ai-semi-automation.md')
          text = path.read_text(encoding='utf-8')

          heading = '### 현실적 제약: 내부망 GitLab/Gitea는 ChatGPT가 바로 읽지 못할 수 있다'
          marker = '### 어떤 것을 선택할 것인가'

          section = r'''### 현실적 제약: 내부망 GitLab/Gitea는 ChatGPT가 바로 읽지 못할 수 있다

GitLab이나 Gitea가 기능적으로 같은 Control Plane 역할을 수행할 수 있다는 것과 **ChatGPT가 현재 채팅에서 그 저장소를 직접 읽고 수정할 수 있다는 것은 다른 문제**다.

실제 고객사에서는 GitLab/Gitea가 다음처럼 배치되는 경우가 많다.

```text
                    Internet / SaaS 영역

                 ChatGPT / Business
                         │
                         │ 기본적으로 직접 접근 불가
                         │
              ───────────┼─────────── 보안 경계
                         │
                         ▼
                 고객사 내부망 / VPN

              GitLab / Gitea / Jenkins
                         │
                         ▼
                Source + CI/CD + Log
                         │
                         ▼
                 Preview / Production
```

예를 들어 저장소 주소가 사설 IP, 내부 DNS, 고객사 VPN 내부에서만 접근 가능한 경우 외부 SaaS에서 실행되는 ChatGPT는 그 주소를 일반 웹사이트처럼 바로 열 수 없다. **ChatGPT Business 또는 Enterprise를 사용한다고 해서 고객사 내부망에 자동으로 네트워크 경로가 생기는 것도 아니다.**

따라서 다음 흐름은 Git 플랫폼 기능만 갖춰져 있다고 자동으로 성립하지 않는다.

```text
ChatGPT
-> 내부 GitLab/Gitea repository 읽기
-> 코드 수정
-> pipeline 실행
-> 내부 job log 읽기
-> 다시 코드 수정
```

이 흐름을 만들려면 ChatGPT와 내부망 사이에 별도의 Adapter 또는 Bridge가 필요하다.

```text
방법 1
ChatGPT
-> 승인된 Custom MCP App / Secure Tunnel
-> 내부 GitLab/Gitea API

방법 2
ChatGPT
-> 외부에서 접근 가능한 통제된 API Gateway
-> 내부 Git platform

방법 3
ChatGPT는 요구사항과 검토만 수행
-> 고객사 내부 Codex / Agent Runner
-> 내부 GitLab/Gitea
-> CI/CD

방법 4
Git platform과 Runner를 모두 고객망 내부에 유지
-> 내부 Agent가 구현/배포/검증
-> 외부 ChatGPT에는 비식별 상태와 결과만 전달
```

OpenAI의 Custom MCP 방식도 로컬 또는 온프레미스 MCP 서버에 ChatGPT가 직접 붙는 구조가 아니라, 비공개 네트워크를 연결하기 위한 별도 보안 터널 또는 원격 접근 계층이 필요하다는 전제로 보는 것이 안전하다.

이 차이 때문에 **모바일 ChatGPT를 중심으로 사람이 관리 포인트를 최소화하려는 목적**에서는 GitHub SaaS가 현재 가장 구현 마찰이 적을 수 있다. 반대로 고객사 정책상 소스와 CI/CD를 내부망에 유지해야 한다면 GitLab/Gitea가 더 적합할 수 있지만, 그 경우 AI orchestration도 고객사 내부 Agent 쪽으로 이동시키는 것이 현실적이다.

```text
ChatGPT 중심 운영 편의 우선
-> 외부에서 승인된 Git provider/API 경로 필요
-> GitHub SaaS가 상대적으로 단순

내부망 격리와 데이터 통제 우선
-> GitLab/Gitea Self-Managed 가능
-> Codex/Agent Runner도 내부망에 두는 방식 권장

내부 GitLab/Gitea + 외부 ChatGPT 직접 제어
-> 별도 MCP/Tunnel/API Bridge 구축 필요
-> 구축·보안검토·운영 비용 증가
```

따라서 고객사 적용 가능성을 판단할 때는 Git 제품명보다 먼저 **"ChatGPT 또는 AI가 해당 Control Plane과 실행 증거에 실제로 도달할 수 있는가"**를 확인해야 한다.

'''

          if heading not in text:
              if marker not in text:
                  raise SystemExit(f'marker not found: {marker}')
              text = text.replace(marker, section + marker, 1)

          old = '11. ChatGPT/Codex가 해당 Git 플랫폼에 접근하는 방법'
          new = ('11. ChatGPT/Codex가 해당 Git 플랫폼에 접근하는 방법\n'
                 '12. Git 플랫폼이 내부망 전용이라면 외부 AI에서 접근 가능한 승인된 Bridge/MCP/Tunnel이 있는지')
          if old in text and '12. Git 플랫폼이 내부망 전용이라면' not in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/patch-internal-git-control-plane-note.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/2026-08-20-github-control-plane-ai-semi-automation.md .github/workflows/patch-internal-git-control-plane-note.yml
          git diff --cached --check
          git commit -m 'docs: explain internal Git network boundary for ChatGPT'
          git push
